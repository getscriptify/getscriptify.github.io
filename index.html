<style>

    --gold-dim:    #8a6f2e;

  /* ── Header ── */

  .brand {

  .brand-icon {

    flex-shrink: 0;
  }
  .brand-icon svg { width: 20px; height: 20px; fill: var(--gold); }

  .brand span {

  }
  @keyframes goldShift {

  .tagline {
    color: var(--text-faint);

  .toolbar::before {

    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);

  .toolbar-row {

  .toolbar input,

  .toolbar input::placeholder { color: var(--text-faint); }
  .toolbar input:focus,

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSs3X9rA31AbPZyBdexF7T-rZWpUevAJWyX3RpMEGLUkZ6rkZBDA61kRHuFZYa-RTBiNzPohSElJNd9/pub?output=csv";
const YOUTUBE_SUBSCRIBE_URL = "https://www.youtube.com/@Scriptify-HQ?sub_confirmation=1";

const DISCORD_URL = 'https://discord.gg/g93eYSGMW';

function hasSubscribed(){ return localStorage.getItem('ks_subscribed') === 'true'; }
function markSubscribed(){ localStorage.setItem('ks_subscribed', 'true'); }
function hasJoinedDiscord(){ return localStorage.getItem('ks_discord') === 'true'; }
function markJoinedDiscord(){ localStorage.setItem('ks_discord', 'true'); }
function isScriptUnlocked(id){ return localStorage.getItem('ks_unlocked_' + id) === 'true'; }
function markScriptUnlocked(id){ localStorage.setItem('ks_unlocked_' + id, 'true'); }

const FALLBACK_DATA = [
  {
    id: "sample-glow",
    title: "Cinematic Glow Macro",
    category: "Color & Light",
    description: "A Fusion macro that adds a soft, filmic glow with adjustable threshold and falloff.",
    linkvertise_link: "https://example.com/linkvertise/sample-glow",
    content_type: "code",
    code: "-- paste your macro code or setup string here in the sheet --",
    download_url: "",
    images: []
  },
  {
    id: "sample-denoise",
    title: "Quick Denoise Preset",
    category: "Noise Reduction",
    description: "A node preset tuned for low-light footage from common mirrorless cameras.",
    linkvertise_link: "https://example.com/linkvertise/sample-denoise",
    content_type: "download",
    code: "",
    download_url: "https://example.com/downloads/sample-denoise.zip",
    images: []
  }
];

let allItems = [];
let favorites = JSON.parse(localStorage.getItem('rpl_favorites') || '[]');

function toggleFavorite(id){
  if(favorites.includes(id)){ favorites = favorites.filter(f => f !== id); }
  else { favorites.push(id); }
  localStorage.setItem('rpl_favorites', JSON.stringify(favorites));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
  return rows.slice(1).filter(r => r.length && r.some(c => c.trim() !== '')).map(r => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (r[idx] || '').trim());
    return obj;
  });
}

async function loadData(){
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cb=' + Date.now());
    if(!res.ok) throw new Error('Sheet fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    if(!rows.length) throw new Error('Empty sheet');
    allItems = rows.map(r => ({
      id: r.id || slugify(r.title || Math.random().toString(36).slice(2)),
      title: r.title || 'Untitled',
      category: r.category || 'Uncategorized',
      description: r.description || '',
      linkvertise_link: r.linkvertise_link || '',
      content_type: (r.content_type || r.contenttype || 'code').toLowerCase(),
      code: r.code || '',
      download_url: r.download_url || r.downloadurl || '',
      images: (r.images || '').replace(/%7C/gi, '|').split('|').map(s => s.trim()).filter(Boolean),
      skip_checkpoint: (r.skip_checkpoint || '').toLowerCase() === 'true'
    }));
  } catch(err){
    console.warn('Falling back to sample data:', err);
    allItems = FALLBACK_DATA;
  }
  populateCategoryFilter();
  render();
  checkForDirectLink();
  loadAdsDeferred();
}

function slugify(str){
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function populateCategoryFilter(){
  const sel = document.getElementById('categoryFilter');
  const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))].sort();
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function checkForDirectLink(){
  const params = new URLSearchParams(window.location.search);
  const unlockId = params.get('unlock');
  const scriptId = params.get('script');

  if(unlockId){
    const item = allItems.find(i => i.id === unlockId);
    if(item){
      markScriptUnlocked(item.id);
      window.history.replaceState({}, '', window.location.origin + window.location.pathname);
      trackEvent('unlock_completed', { script_id: item.id });
      openModal(item);
    }
    return;
  }
  if(scriptId){
    const item = allItems.find(i => i.id === scriptId);
    if(item){
      window.history.replaceState({}, '', window.location.origin + window.location.pathname);
      trackEvent('direct_link_landing', { script_id: item.id });
      handleViewClick(item.id);
    }
  }
}

function loadAdsDeferred(){
  setTimeout(() => { loadAdsterra(); }, 150);
}

function render(){
  const grid = document.getElementById('grid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categoryFilter').value;
  const sort = document.getElementById('sortSelect').value;
  const favOnly = document.getElementById('favOnly').checked;

  let items = allItems.filter(i => {
    if(favOnly && !favorites.includes(i.id)) return false;
    if(cat && i.category !== cat) return false;
    if(search){
      const hay = (i.title + ' ' + i.description + ' ' + i.category).toLowerCase();
      if(!hay.includes(search)) return false;
    }
    return true;
  });

  if(sort === 'alpha'){ items.sort((a,b) => a.title.localeCompare(b.title)); }
  else if(sort === 'newest'){ items = items.slice().reverse(); }

  if(!items.length){
    grid.innerHTML = '<div class="empty-state">No scripts match. Try clearing filters or search.</div>';
    return;
  }

  grid.innerHTML = items.map(i => {
    const isFav = favorites.includes(i.id);
    return `
      <div class="card">
        <h3>${escapeHtml(i.title)}</h3>
        ${renderCarousel(i)}
        <div class="meta"><b>Category:</b> ${escapeHtml(i.category)}</div>
        <div class="desc">${escapeHtml(i.description)}</div>
        <div class="card-actions">
          <button class="btn btn-view" onclick="handleViewClick('${i.id}')">🔒 Unlock</button>
          <button class="btn btn-fav ${isFav ? 'active' : ''}" onclick="handleFavClick('${i.id}')">♥</button>
        </div>
      </div>
    `;
  }).join('');

  observeCarousels();
  startAutoplay();
}

function renderCarousel(item){
  if(!item.images || !item.images.length) return '';
  const slides = item.images.map((src, idx) =>
    `<img src="${escapeHtml(src)}" class="carousel-slide" data-index="${idx}" style="display:${idx===0?'block':'none'}" alt="${escapeHtml(item.title)}" loading="lazy">`
  ).join('');
  const dots = item.images.length > 1
    ? `<div class="carousel-dots">${item.images.map((_, idx) => `<span class="dot-indicator ${idx===0?'active':''}" data-index="${idx}"></span>`).join('')}</div>`
    : '';
  const arrows = item.images.length > 1 ? `
    <button class="carousel-arrow carousel-prev" onclick="moveCarousel(this,-1)" aria-label="Previous">&#8249;</button>
    <button class="carousel-arrow carousel-next" onclick="moveCarousel(this,1)" aria-label="Next">&#8250;</button>
  ` : '';
  return `<div class="carousel" data-current="0"><div class="carousel-track">${slides}</div>${arrows}${dots}</div>`;
}

function advanceCarousel(carousel, dir){
  const slides = carousel.querySelectorAll('.carousel-slide');
  const dots   = carousel.querySelectorAll('.dot-indicator');
  if(!slides.length) return;
  let current = parseInt(carousel.dataset.current, 10) || 0;
  slides[current].style.display = 'none';
  if(dots[current]) dots[current].classList.remove('active');
  current = (current + dir + slides.length) % slides.length;
  slides[current].style.display = 'block';
  if(dots[current]) dots[current].classList.add('active');
  carousel.dataset.current = current;
}

function moveCarousel(btn, dir){
  autoplayStopped = true;
  if(autoplayInterval){ clearInterval(autoplayInterval); autoplayInterval = null; }
  advanceCarousel(btn.closest('.carousel'), dir);
}

let autoplayStopped = false, autoplayInterval = null;
const visibleCarousels = new Set();

const carouselObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => { if(e.isIntersecting){ visibleCarousels.add(e.target); } else { visibleCarousels.delete(e.target); } });
}, { threshold: 0.4 });

function observeCarousels(){
  if(autoplayStopped) return;
  document.querySelectorAll('.carousel').forEach(c => {
    if(c.querySelectorAll('.carousel-slide').length > 1){ carouselObserver.observe(c); }
  });
}

function startAutoplay(){
  if(autoplayInterval || autoplayStopped) return;
  autoplayInterval = setInterval(() => {
    if(autoplayStopped){ clearInterval(autoplayInterval); autoplayInterval = null; return; }
    visibleCarousels.forEach(carousel => advanceCarousel(carousel, 1));
  }, 3000);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function handleFavClick(id){ toggleFavorite(id); render(); }

function handleViewClick(id){
  trackEvent('unlock_button_clicked', { script_id: id });
  const item = allItems.find(i => i.id === id);
  if(!item) return;
  if(isScriptUnlocked(id)){ trackEvent('already_unlocked_modal_opened', { script_id: id }); openModal(item); return; }
  openKeySystem(item);
}

function openKeySystem(item){
  trackEvent('key_system_opened', { script_id: item.id });
  const overlay  = document.getElementById('modalOverlay');
  const modal    = document.getElementById('modalContent');
  const subDone  = hasSubscribed();
  const dcDone   = hasJoinedDiscord();

  // Step 3 (Linkvertise) only shown for cards that need it
  const linkvertiseHtml = item.skip_checkpoint ? '' : `
    <div id="ksStepLv" style="${(subDone && dcDone) ? '' : 'opacity:0.35;pointer-events:none;'}">
      <div class="ks-step-box" style="margin-bottom:0;">
        <div class="ks-step-label">Step 3 — Unlock the script</div>
        <button class="ks-action-btn" onclick="ksGoUnlock('${item.id}','linkvertise')">
          <div class="ks-btn-icon">🔗</div>
          <div>
            <div class="ks-btn-name">Continue with Linkvertise</div>
            <div class="ks-btn-hint">~15 seconds · Supports free keys</div>
          </div>
          <div class="ks-btn-arrow">→</div>
        </button>
      </div>
    </div>
  `;

  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <h2>${escapeHtml(item.title)}</h2>
    <div class="desc" style="margin-bottom:20px;">Complete the steps below to unlock this script.</div>

    <div id="ksStepYt" class="ks-step-box" style="${subDone ? 'display:none;' : ''}">
      <div class="ks-step-label">Step 1 — Subscribe on YouTube</div>
      <p style="font-size:13px;color:var(--text-dim);margin:0 0 14px;line-height:1.6;">Subscribe to our channel once — applies to all scripts.</p>
      <button class="ks-gold-btn" id="ksSubBtn" onclick="ksDoSubscribe('${item.id}')">Subscribe on YouTube →</button>
    </div>

    <div id="ksStepDc" class="ks-step-box" style="${dcDone ? 'display:none;' : (!subDone ? 'opacity:0.35;pointer-events:none;' : '')}">
      <div class="ks-step-label">Step 2 — Join Discord</div>
      <p style="font-size:13px;color:var(--text-dim);margin:0 0 14px;line-height:1.6;">Join our Discord server once — applies to all scripts.</p>
      <button class="ks-gold-btn" id="ksDcBtn" onclick="ksDoDiscord('${item.id}')">Join Discord →</button>
    </div>

    ${linkvertiseHtml}
  `;
  overlay.classList.add('show');
}

const REQUIRED_AWAY_MS = 4000;
let ksAwayStart = null, ksAwayHandler = null;

// ── Step 1: YouTube ──────────────────────────────────────────
function ksDoSubscribe(itemId){
  trackEvent('subscribe_button_clicked', { script_id: itemId });
  const btn = document.getElementById('ksSubBtn');
  btn.disabled = true;
  btn.textContent = 'Waiting for you to subscribe…';
  window.open(YOUTUBE_SUBSCRIBE_URL, '_blank');
  ksCleanupAwayTracking();
  ksAwayStart = null;

  ksAwayHandler = function(){
    if(document.hidden){ ksAwayStart = Date.now(); }
    else {
      if(ksAwayStart !== null){
        const awayFor = Date.now() - ksAwayStart;
        if(awayFor >= REQUIRED_AWAY_MS){
          ksVerifiedSubscribe(itemId);
        } else {
          ksAwayStart = null;
          btn.disabled = false;
          btn.textContent = 'Subscribe on YouTube →';
          trackEvent('subscribe_verification_failed_too_fast', { script_id: itemId });
          showToast("Looks like you haven't subscribed yet — please try again.");
        }
      }
    }
  };
  document.addEventListener('visibilitychange', ksAwayHandler);
  window.addEventListener('blur', ksAwayHandler);
  window.addEventListener('focus', ksAwayHandler);
}

function ksVerifiedSubscribe(itemId){
  ksCleanupAwayTracking();
  markSubscribed();
  trackEvent('subscribe_verified', { script_id: itemId });

  // Hide YouTube step, reveal Discord step
  const ytStep = document.getElementById('ksStepYt');
  const dcStep = document.getElementById('ksStepDc');
  if(ytStep) ytStep.style.display = 'none';
  if(dcStep){ dcStep.style.opacity = '1'; dcStep.style.pointerEvents = 'auto'; }
  showToast('Subscribed ✓ — now join the Discord');
}

// ── Step 2: Discord ──────────────────────────────────────────
function ksDoDiscord(itemId){
  trackEvent('discord_button_clicked', { script_id: itemId });
  const btn = document.getElementById('ksDcBtn');
  btn.disabled = true;
  btn.textContent = 'Waiting for you to join…';
  window.open(DISCORD_URL, '_blank');
  ksCleanupAwayTracking();
  ksAwayStart = null;

  ksAwayHandler = function(){
    if(document.hidden){ ksAwayStart = Date.now(); }
    else {
      if(ksAwayStart !== null){
        const awayFor = Date.now() - ksAwayStart;
        if(awayFor >= REQUIRED_AWAY_MS){
          ksVerifiedDiscord(itemId);
        } else {
          ksAwayStart = null;
          btn.disabled = false;
          btn.textContent = 'Join Discord →';
          trackEvent('discord_verification_failed_too_fast', { script_id: itemId });
          showToast("Looks like you haven't joined yet — please try again.");
        }
      }
    }
  };
  document.addEventListener('visibilitychange', ksAwayHandler);
  window.addEventListener('blur', ksAwayHandler);
  window.addEventListener('focus', ksAwayHandler);
}

function ksVerifiedDiscord(itemId){
  ksCleanupAwayTracking();
  markJoinedDiscord();
  trackEvent('discord_verified', { script_id: itemId });

  const item = allItems.find(i => i.id === itemId);

  // skip_checkpoint cards: both steps done → unlock immediately
  if(item && item.skip_checkpoint){
    markScriptUnlocked(itemId);
    trackEvent('unlock_completed', { script_id: itemId, method: 'yt_dc_only' });
    showToast('Unlocked!');
    openModal(item);
    return;
  }

  // Otherwise reveal Linkvertise step
  const dcStep = document.getElementById('ksStepDc');
  const lvStep = document.getElementById('ksStepLv');
  if(dcStep) dcStep.style.display = 'none';
  if(lvStep){ lvStep.style.opacity = '1'; lvStep.style.pointerEvents = 'auto'; }
  showToast('Discord joined ✓ — one last step');
}

function ksCleanupAwayTracking(){
  if(ksAwayHandler){
    document.removeEventListener('visibilitychange', ksAwayHandler);
    window.removeEventListener('blur', ksAwayHandler);
    window.removeEventListener('focus', ksAwayHandler);
    ksAwayHandler = null;
  }
  ksAwayStart = null;
}

function ksGoUnlock(itemId, method){
  const item = allItems.find(i => i.id === itemId);
  if(!item) return;
  const link = item.linkvertise_link;
  trackEvent('unlock_method_clicked', { script_id: itemId, method, has_link: !!link });
  if(!link){ showToast('No ' + method + ' link set for this script yet.'); return; }
  window.location.href = link;
}

function openModal(item){
  const overlay = document.getElementById('modalOverlay');
  const modal   = document.getElementById('modalContent');
  let bodyHtml = '';
  if(item.content_type === 'download' && item.download_url){
    bodyHtml = `<a class="download-btn" href="${escapeHtml(item.download_url)}" target="_blank" rel="noopener">⬇ Download Plugin</a>`;
  } else {
    bodyHtml = `
      <div class="code-box" id="codeBox-${item.id}">${escapeHtml(item.code)}</div>
      <button class="copy-btn" onclick="copyCode('${item.id}')">📋 Copy Code</button>`;
  }
  modal.innerHTML = `
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <h2>${escapeHtml(item.title)}</h2>
    <div class="meta">Category: ${escapeHtml(item.category)}</div>
    <div class="desc">${escapeHtml(item.description)}</div>
    ${bodyHtml}
  `;
  overlay.classList.add('show');
}

function copyCode(id){
  const item = allItems.find(i => i.id === id);
  if(!item) return;
  navigator.clipboard.writeText(item.code).then(() => showToast('Copied to clipboard!'));
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  ksCleanupAwayTracking();
}

document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target.id === 'modalOverlay') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('categoryFilter').addEventListener('change', render);
document.getElementById('sortSelect').addEventListener('change', render);
document.getElementById('favOnly').addEventListener('change', render);

function trackEvent(name, params){
  params = params || {};
  if(typeof gtag === 'function'){ gtag('event', name, params); }
  if(window.location.hostname === 'localhost' || window.location.search.includes('debug=1')){ console.log('[track]', name, params); }
}

window.addEventListener('load', () => {
  trackEvent('page_loaded', { path: window.location.pathname, has_query: !!window.location.search });
});

loadData();
</script>
